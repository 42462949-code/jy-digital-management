<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>佳洋本机数据迁移备份</title><style>body{max-width:850px;margin:35px auto;padding:20px;font:15px 'Microsoft YaHei',sans-serif;color:#234368;background:#f5f8fb}main{background:#fff;padding:24px;border:1px solid #d8e4ef;border-radius:10px}h1{font-size:24px;margin:0 0 18px}p{line-height:1.8}button{background:#2466b8;color:#fff;border:0;padding:12px 20px;border-radius:6px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}table{width:100%;border-collapse:collapse;margin:16px 0}th,td{padding:6px 10px;border:1px solid #d8e4ef;text-align:center}th{background:#eef5fc}td:first-child{text-align:left}#result{white-space:pre-wrap;line-height:1.8}.muted{font-size:13px;color:#61788e}</style></head><body><main><h1>本机数据迁移备份</h1><p>请在保存原系统数据的电脑、同一个浏览器中打开此页。这里读取本机已保存的数据，导出不会删除、修改或上传原数据。</p><p>备份包含现有业务表、信息录入、扫码状态、工单批次及报表目标等迁移资料。账号权限保留为脱敏记录；账号密码、登录凭据及密钥不导出，切换共享系统时需另行建立账号并设置密码。</p><button id="export" disabled>导出迁移备份 JSON</button><p id="result" role="status">正在读取本机存储…</p><table id="counts" hidden><thead><tr><th>表名</th><th>记录数</th></tr></thead><tbody></tbody></table><p class="muted">导出备份不会自动开启多人共享。连接共享数据库并迁入数据后，其他用户才能按权限查看同一份记录。</p></main><script src="storage.js?v=20261104-hourlytoolbar186"></script><script>
(()=>{'use strict';
const status=document.getElementById('result'),button=document.getElementById('export'),labels=['销售订单列表','生产工单明细表','各工序每日生产明细表','原临时表','考勤表','原库存表','原出入库表','生产数据看板资料','扫码报工','生产班组','单价表','人均小时产值统计资料','即时库存','出入库明细表','用户与权限（密码脱敏）'];
function snapshot(){
 const raw=jyStorage.getJSON('jy-data',null);
 if(!Array.isArray(raw)||raw.length<7||raw.length>15||raw.some(rows=>!Array.isArray(rows)||rows.some(row=>!Array.isArray(row))))throw Error('本浏览器未找到完整、可识别的业务数据。请回到保存原数据的电脑和浏览器，打开原系统并保存后重试。');
 const tables=Array.from({length:15},(_,i)=>(raw[i]||[]).map(row=>row.slice()));
 for(const row of tables[14])row[4]='****';
 return {format:'jiayang-migration-v1',sourceLabel:'本机主数据 '+new Date().toISOString(),tables,information:{0:jyStorage.getJSON('jy-sales-information',{}),1:jyStorage.getJSON('jy-work-information',{})},scanMeta:jyStorage.getJSON('jy-scan-state-v1',{}).meta||[],workRowIdentities:jyStorage.getJSON('jy-work-row-identities-v1',[]),workPrintLinks:jyStorage.getJSON('jy-work-print-links-v1',{}),supplemental:{hourlyTargets:jyStorage.getJSON('jy-hourly-output-targets',{}),productionMeta:jyStorage.getJSON('jy-production-meta-v1',null),voucherSequence:jyStorage.getItem('jy-voucher-sequence'),accessTemplate:jyStorage.getJSON('jy-access-template-v1',null)}};
}
function showCounts(data){const body=document.querySelector('#counts tbody');body.replaceChildren();data.tables.forEach((rows,i)=>{const tr=document.createElement('tr');for(const value of [labels[i],String(rows.length)]){const td=document.createElement('td');td.textContent=value;tr.append(td)}body.append(tr)});document.getElementById('counts').hidden=false;return data.tables.reduce((sum,rows)=>sum+rows.length,0)}
(async()=>{await jyStorage.ready;if(jyStorage.volatile)throw Error('浏览器存储当前不可用，请先恢复存储后再备份。');const total=showCounts(snapshot());status.textContent='已读取15个表格位置，共 '+total+' 行。请核对记录数后导出。';button.disabled=false;button.onclick=async()=>{button.disabled=true;try{await jyStorage.flush();const data=snapshot(),count=showCounts(data),blob=new Blob([JSON.stringify(data)],{type:'application/json'}),link=document.createElement('a'),url=URL.createObjectURL(blob),day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());link.href=url;link.download='佳洋业务数据迁移备份-'+day+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='已生成迁移备份，共 '+count+' 行。请在浏览器下载列表确认文件已保存。原数据未作改动。'}catch(error){status.textContent='备份未完成：'+error.message}finally{button.disabled=false}}})().catch(error=>{status.textContent='读取失败：'+error.message;button.disabled=true});
})();
</script></body></html>
