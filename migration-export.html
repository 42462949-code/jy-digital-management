<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>佳洋原本机数据迁移备份</title><style>body{max-width:780px;margin:50px auto;padding:20px;font:16px 'Microsoft YaHei',sans-serif;color:#234368}button{background:#2466b8;color:#fff;border:0;padding:12px 20px;border-radius:6px;font:inherit;cursor:pointer}p{line-height:1.8}#result{white-space:pre-wrap}</style><h1>原本机数据迁移备份</h1><p>请在保存原系统数据的电脑、同一个浏览器打开此页。导出包含各业务表、信息录入、扫码状态和工单批次标识，不包含账号密码。此操作不会删除或修改本机数据。</p><button id="export" disabled>导出迁移备份 JSON</button><p id="result">正在读取本机存储…</p><script src="storage.js"></script><script>
(async()=>{await jyStorage.ready;const tables=jyStorage.getJSON('jy-data',[]),status=document.getElementById('result');if(!Array.isArray(tables)||tables.length!==10){status.textContent='本浏览器未找到完整业务数据。请回到保存原数据的电脑和浏览器操作。';return}status.textContent='发现业务数据：'+tables.reduce((sum,rows)=>sum+(Array.isArray(rows)?rows.length:0),0)+' 行。请保存好备份文件。';const button=document.getElementById('export');button.disabled=false;button.onclick=()=>{const snapshot={format:'jiayang-migration-v1',sourceLabel:'原本机主数据 '+new Date().toISOString(),tables,information:{0:jyStorage.getJSON('jy-sales-information',{}),1:jyStorage.getJSON('jy-work-information',{})},scanMeta:jyStorage.getJSON('jy-scan-state-v1',{}).meta||[],workRowIdentities:jyStorage.getJSON('jy-work-row-identities-v1',[])};const blob=new Blob([JSON.stringify(snapshot)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='佳洋业务数据迁移备份-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),30000)}})().catch(error=>document.getElementById('result').textContent='读取失败：'+error.message);
</script></html>
